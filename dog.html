<script>(function(){

const BASE={sys:120,dia:80,hr:120};
const SCALE_MAX=260;
const DOSE={low:.5,normal:1,high:2};
const DR={adrenaline:{n:"Adrenaline",d:3},epi_beta:{n:"Adrenaline (beta dose)",d:.1,fix:1/30},norepi:{n:"Noradrenaline",d:3},iso:{n:"Isoprenaline",d:3},acetylcholine:{n:"Acetylcholine",d:5},histamine:{n:"Histamine",d:3},ephedrine:{n:"Ephedrine",d:100},phentolamine:{n:"Phentolamine",d:1000},propranolol:{n:"Propranolol",d:1000},atropine:{n:"Atropine",d:750},mepyramine:{n:"Mepyramine",d:5000},cimetidine:{n:"Cimetidine",d:5000},occlusion:{n:"Bilateral carotid occlusion (15 s)"},vagC:{n:"Central vagus stimulation"},vagP:{n:"Peripheral vagus stimulation"},vagotomy:{n:"Bilateral vagotomy"}};
const PROT={
p16:{t:"Row 16: Atropine 1500 then ACh 150",a:["atropine",2,"Atropine 1500"],b:["acetylcholine",2,"ACh 150 after atropine",1]},
p17:{t:"Row 17: Propranolol 1000 then Isoprenaline 3",a:["propranolol",1,"Propranolol 1000"],b:["iso",1,"Isoprenaline 3 after propranolol"]},
p18:{t:"Row 18: Phentolamine 1000 then Adrenaline 3",a:["phentolamine",1,"Phentolamine 1000"],b:["adrenaline",1,"Adrenaline 3 after phentolamine"]},
p19:{t:"Row 19: Phentolamine 1000 then Noradrenaline 3",a:["phentolamine",1,"Phentolamine 1000"],b:["norepi",1,"Noradrenaline 3 after phentolamine"]},
p20:{t:"Row 20: Mepyramine 5000 then Histamine 3",a:["mepyramine",1,"Mepyramine 5000"],b:["histamine",1,"Histamine 3 after mepyramine"]}};
const PROT_DELAY=40;
function satm(m){return m<=2?m:2+2*Math.log(m/2)}
function blk(m){const P=[[0,0],[.5,.6],[1,.9],[2,.97],[10,.995]];if(m<=0)return 0;if(m>=10)return .995;for(let i=1;i<P.length;i++)if(m<=P[i][0]){const a=P[i-1],b=P[i];return a[1]+(b[1]-a[1])*(m-a[0])/(b[0]-a[0])}return .995}
function shortLbl(s){const t=s.split(" ");return /^[\d.]+$/.test(t[1]||"")?t[0]+" "+t[1]:t[0]}
function mk(){return{cur:{...BASE},fx:[],vag:false,atH:0,atM:0,rem:0,A:0,B:0,Af:0,Bf:0,H1:0,H2:0,S:1,t:0,q:[],tr:null,rows:[],hist:[],marks:[],hacc:0,dead:null,dShown:0,tLM:0,tLH:0,tHM:0,tHH:0}}
let S=mk();
const $=id=>document.getElementById(id);
const mapOf=c=>(c.sys+2*c.dia)/3;
const sgn=n=>(n>0?"+":"")+n;
function logMessage(msg){const b=$("logBox"),d=document.createElement("div");d.className="log-entry";d.textContent="[t+"+Math.round(S.t)+"s] "+msg;b.appendChild(d);while(b.children.length>40)b.removeChild(b.firstChild);b.scrollTop=b.scrollHeight}
function achFactor(s){return s.atM===0?1:(s.atM<=.5?.02:(s.atM<=1?.06:.3))}
function baro(s){return!s.vag&&s.atM===0}
function startTracker(s,label){finishTracker(s);s.tr={label,t:0,pre:{...s.cur},s:0,d:0,m:0,h:0}}
function finishTracker(s){if(!s.tr)return;const t=s.tr;s.rows.push({label:t.label,s:Math.round(t.s),d:Math.round(t.d),m:Math.round(t.m),h:Math.round(t.h)});s.tr=null;renderResults()}
function renderResults(){const w=$("resultsWrap");if(!S.rows.length){w.innerHTML='<p class="empty">No interventions recorded yet.</p>';return}
let h="<table><tr><th>Step</th><th>SBP</th><th>DBP</th><th>MAP</th><th>HR</th></tr>";
S.rows.forEach(r=>{const c=document.createElement("td");c.textContent=r.label;h+="<tr><td>"+c.innerHTML+"</td><td>"+sgn(r.s)+"</td><td>"+sgn(r.d)+"</td><td>"+sgn(r.m)+"</td><td>"+sgn(r.h)+"</td></tr>"});
w.innerHTML=h+"</table>"}
function inject(s,k,m,o){o=o||{};
const add=(type,x)=>s.fx.push(Object.assign({type,m:satm(m),age:0,hold:0},x));
const lv=m<=.5?"low":(m<=1?"standard":"high");
switch(k){
case"adrenaline":case"epi_beta":{add("epi",{rise:4,tau:25});
if(k==="epi_beta")return"Adrenaline 0.1 mcg/kg: beta-2 vasodilation outweighs alpha, DBP and MAP fall, HR rises (beta-1).";
let t="Adrenaline ("+lv+"): BP rises (alpha-1 vasoconstriction, beta-1 inotropy). ";
t+=s.A>.3?"Alpha receptors are blocked: unopposed beta-2 vasodilation, BP falls (adrenaline reversal)."
:s.B>.3?"Beta receptors are blocked: alpha pressor action is unmasked, bigger rise, reflex bradycardia."
:baro(s)?"Baroreflex vagal slowing opposes the direct beta-1 tachycardia, so HR changes little or falls."
:"No vagal brake (atropine or vagotomy): unopposed beta-1 tachycardia.";
if(m<=.5&&s.A<.3&&s.B<.3)t+=" Diastolic may dip (beta-2 vasodilation).";return t}
case"norepi":add("ne",{rise:4,tau:25});
return s.A>.3?"Noradrenaline: alpha receptors blocked, almost no pressor response (no beta-2 effect to reverse it).":"Noradrenaline: strong alpha-1 vasoconstriction plus beta-1, big rise in SBP/DBP/MAP; baroreflex bradycardia lowers HR.";
case"iso":add("iso",{rise:3,tau:20});
return s.B>.3?"Isoprenaline: beta receptors blocked by propranolol, response abolished.":"Isoprenaline: beta-1 tachycardia, beta-2 vasodilation, DBP and MAP fall, pulse pressure widens.";
case"acetylcholine":{const nic=s.atM>0?(o.vh?1.6:m>=2?1:m>=1?.3:.05):0;add("ach",{rise:1,tau:7,nic});
if(s.atM>0)return"ACh ("+lv+"): muscarinic receptors blocked, depressor response abolished."+(nic>=1?" Nicotinic action on ganglia and adrenal medulla is unmasked: pressor response.":"");

const QS=[
{q:"Q1. Bilateral carotid occlusion (15 s): MAP change and mechanism?",g:{T:60,s:[[10,"occlusion",1,"Occl"]]},a:`<p><b>MAP rises</b> (about +25 to 35 mmHg) for the 15 s of occlusion, with a rise in HR, then returns to baseline on release.</p><ul><li>Occlusion lowers pressure at the carotid sinus, so baroreceptor firing (glossopharyngeal nerve) falls.</li><li>The brainstem (NTS, medulla) reads this as low BP: vagal tone falls and sympathetic outflow rises.</li><li>Result: arteriolar and venous vasoconstriction (alpha-1), more cardiac output (beta-1), higher HR.</li><li>Abolished by vagotomy (HR part) and by alpha/beta blockade (vascular and cardiac parts).</li></ul>`},
{q:"Q2. Sympathetic and parasympathetic receptors: types, locations, functions",a:`<table><tr><th>Receptor</th><th>Location</th><th>Main effect</th></tr>
<tr><td>Alpha-1</td><td>Vascular smooth muscle, iris dilator, sphincters</td><td>Vasoconstriction (raises TPR and BP), mydriasis</td></tr>
<tr><td>Alpha-2</td><td>Presynaptic sympathetic terminals, platelets, pancreatic beta cells</td><td>Less NE release, platelet aggregation, less insulin</td></tr>
<tr><td>Beta-1</td><td>SA/AV node, myocardium, juxtaglomerular cells</td><td>Raises HR, contractility, conduction, renin</td></tr>
<tr><td>Beta-2</td><td>Skeletal-muscle vessels, bronchi, uterus, liver</td><td>Vasodilation, bronchodilation, glycogenolysis</td></tr>
<tr><td>Beta-3</td><td>Adipose tissue, bladder</td><td>Lipolysis, bladder relaxation</td></tr>
<tr><td>M1</td><td>Autonomic ganglia, CNS, gastric ECL cells</td><td>Ganglionic excitation, acid secretion</td></tr>
<tr><td>M2</td><td>Heart (SA, AV node, atria)</td><td>Lower HR and conduction (K+ efflux)</td></tr>
<tr><td>M3</td><td>Smooth muscle, glands, endothelium, iris sphincter</td><td>Contraction, secretion, NO-mediated vasodilation, miosis</td></tr>
<tr><td>Nicotinic NN</td><td>All autonomic ganglia, adrenal medulla</td><td>Ganglionic transmission, adrenaline release</td></tr>
<tr><td>Nicotinic NM</td><td>Skeletal neuromuscular junction</td><td>Muscle contraction</td></tr></table>`},
{q:"Q3. Graph 1 (p.80): Epi 0.1 mcg/kg, Epi 6 mcg/kg, NE 6 mcg/kg",g:{T:220,s:[[10,"epi_beta",1/30,"Epi 0.1"],[70,"adrenaline",2,"Epi 6"],[140,"norepi",2,"NE 6"]]},a:`<p><b>(a) Epi 6:</b> large rise in SBP, DBP and MAP. HR rises briefly then falls.</p><ul><li>High dose recruits alpha-1 vasoconstriction (raises TPR), plus beta-1 (more contractility and output). Alpha outweighs beta-2 vasodilation.</li><li>The big rise in MAP triggers baroreflex vagal slowing, which opposes the direct beta-1 tachycardia.</li></ul><p><b>(b) Low vs high dose:</b> beta-2 receptors are more sensitive to adrenaline than alpha-1. At 0.1 mcg/kg beta-2 vasodilation dominates: DBP and MAP fall, SBP rises slightly, HR rises. At 6 mcg/kg alpha-1 is also activated and dominates, so MAP rises.</p><p><b>(c) NE bigger than Epi:</b> NE has strong alpha-1 and beta-1 action but almost no beta-2 effect, so nothing offsets the vasoconstriction. Epi's beta-2 vasodilation partly cancels its alpha effect. NE also gives more marked reflex bradycardia.</p>`},
{q:"Q4. Graph 2 (p.80): repeated ephedrine, phentolamine, ephedrine",g:{T:290,s:[[10,"ephedrine",1,"Eph"],[60,"ephedrine",1,"Eph"],[110,"ephedrine",1,"Eph"],[160,"phentolamine",1,"Phent"],[225,"ephedrine",1,"Eph"]]},a:`<p><b>(a) Mechanism:</b> mainly indirect sympathomimetic. It enters the nerve terminal and releases stored NE, which acts on alpha-1 and beta-1 to raise BP. It also has a weak direct action on alpha and beta receptors. HR change is small because of reflex slowing.</p><p><b>(b) Reduced response with repeats = tachyphylaxis:</b> the releasable NE pool is depleted and refills slowly. Examples: ephedrine itself, tyramine, amphetamine.</p><p><b>(c) After phentolamine:</b> alpha receptors are blocked, so released NE cannot vasoconstrict. The weak direct action is not enough, so the pressor response is abolished.</p>`},
{q:"Q5. Graph 3 (p.81): Epi, NE, phentolamine, Epi",g:{T:320,s:[[10,"adrenaline",1,"Epi"],[70,"norepi",1,"NE"],[130,"phentolamine",1,"Phent"],[190,"norepi",1,"NE"],[250,"adrenaline",1,"Epi"]]},a:`<p><b>(a) Phentolamine:</b> blocks alpha-1, so resting sympathetic vasoconstrictor tone is lost: vasodilation, lower TPR, MAP falls. HR rises by baroreflex (less vagal tone, more sympathetic drive). Alpha-2 blockade also increases NE release, adding beta-1 tachycardia.</p><p><b>(b) NE ineffective:</b> NE acts mainly on alpha receptors (vasoconstriction), now blocked. It has no beta-2 action to reverse the effect, so there is little or no pressor response, only a small beta-1 effect on the heart. (The tracing shows a second NE after phentolamine to illustrate this.)</p><p><b>(c) Epi reverses = Dale's vasomotor reversal:</b> alpha is blocked, so adrenaline's beta-2 vasodilation is unmasked: MAP falls instead of rising, HR rises (beta-1).</p>`},
{q:"Q6. Graph 4 (p.82-83): Epi, propranolol, Epi, isoprenaline",g:{T:260,s:[[10,"adrenaline",1,"Epi"],[70,"propranolol",1,"Prop"],[130,"adrenaline",1,"Epi"],[190,"iso",1,"Iso"]]},a:`<p><b>(a) Propranolol:</b> non-selective competitive beta-1 and beta-2 antagonist. Lowers HR and contractility (small fall in BP), and blocks beta-mediated vasodilation.</p><p><b>(b) Epi before vs after:</b> before, SBP and MAP rise with HR change small or increased. After, the pressor rise is larger and longer and the tachycardia is lost (HR falls by reflex), because beta-2 vasodilation and beta-1 cardiac stimulation are blocked. This is <b>unmasking of the alpha (pressor) effect</b>.</p><p><b>(c) Isoprenaline ineffective:</b> it is a pure beta agonist and the beta receptors are occupied by propranolol (competitive, surmountable only by very large doses), so no tachycardia and no fall in DBP.</p>`},
{q:"Q7. Graph 5 (p.84): ACh, atropine, ACh (high dose)",g:{T:190,s:[[10,"acetylcholine",1,"ACh"],[60,"atropine",2,"Atrop"],[130,"acetylcholine",2,"ACh hi",{vh:1}]]},a:`<p><b>(a) Fall in HR and BP:</b> M2 receptors at the SA and AV nodes open K+ channels: bradycardia and slower conduction. M3 receptors on vascular endothelium release NO: vasodilation, lower TPR.</p><p><b>(b) Short-lived:</b> ACh is hydrolysed within seconds by acetylcholinesterase and plasma cholinesterase.</p><p><b>(c) Atropine:</b> blocks M2 and removes resting vagal tone, so HR rises. Most vessels have little parasympathetic innervation and their tone is sympathetic, so MAP changes little.</p><p><b>(d) High-dose ACh after atropine:</b> muscarinic effects are blocked, so ACh now acts on nicotinic (NN) receptors in autonomic ganglia and the adrenal medulla. Sympathetic ganglia stimulation and adrenaline release raise BP and HR (Dale's nicotinic effect).</p>`}
