<script>(function(){

const BASE={sys:120,dia:80,hr:120};
const SCALE_MAX=260;
const DOSE={low:.5,normal:1,high:2};
const DR={adrenaline:{n:"Adrenaline",d:3},epi_beta:{n:"Adrenaline (beta dose)",d:.1,fix:1/30},norepi:{n:"Noradrenaline",d:3},iso:{n:"Isoprenaline",d:3},acetylcholine:{n:"Acetylcholine",d:5},histamine:{n:"Histamine",d:3},ephedrine:{n:"Ephedrine",d:100},phentolamine:{n:"Phentolamine",d:1000},propranolol:{n:"Propranolol",d:1000},atropine:{n:"Atropine",d:750},mepyramine:{n:"Mepyramine",d:5000},cimetidine:{n:"Cimetidine",d:5000},occlusion:{n:"Bilateral carotid occlusion (15 s)"},vagC:{n:"Central vagus stimulation"},vagP:{n:"Peripheral vagus stimulation"},vagotomy:{n:"Bilateral vagotomy"}};
const PROT={
p16:{t:"Row 16: Atropine 1500 then ACh 150",a:["atropine",2,"Atropine 1500"],b:["acetylcholine",2,"ACh 150 after atropine",1]},
p17:{t:"Row 17: Propranolol 1000 then Isoprenaline 3",a:["propranolol",1,"Propranolol 1000"],b:["iso",1,"Isoprenaline 3 after propranolol"]},
p18:{t:"Row 18: Phentolamine 1000 then Adrenaline 3",a:["phentolamine",1,"Phentolamine 1000"],b:["adrenaline",1,"Adrenaline 3 after phentolamine"]},
p19:{t:"Row 19: Phentolamine 1000 then Noradrenaline 3",a:["phentolamine",1,"Phentolamine 1000"],b:["norepi",1,"Noradrenaline 3 after phentolamine"]},
p20:{t:"Row 20: Mepyramine 5000 then Histamine 3",a:["mepyramine",1,"Mepyramine 5000"],b:["histamine",1,"Histamine 3 after mepyramine"]}};
const PROT_DELAY=40;
function satm(m){return m<=2?m:2+2*Math.log(m/2)}
function blk(m){const P=[[0,0],[.5,.6],[1,.9],[2,.97],[10,.995]];if(m<=0)return 0;if(m>=10)return .995;for(let i=1;i<P.length;i++)if(m<=P[i][0]){const a=P[i-1],b=P[i];return a[1]+(b[1]-a[1])*(m-a[0])/(b[0]-a[0])}return .995}
function shortLbl(s){const t=s.split(" ");return /^[\d.]+$/.test(t[1]||"")?t[0]+" "+t[1]:t[0]}
function mk(){return{cur:{...BASE},fx:[],vag:false,atH:0,atM:0,rem:0,A:0,B:0,Af:0,Bf:0,H1:0,H2:0,S:1,t:0,q:[],tr:null,rows:[],hist:[],marks:[],hacc:0,dead:null,dShown:0,tLM:0,tLH:0,tHM:0,tHH:0}}
let S=mk();
const $=id=>document.getElementById(id);
const mapOf=c=>(c.sys+2*c.dia)/3;
const sgn=n=>(n>0?"+":"")+n;
function logMessage(msg){const b=$("logBox"),d=document.createElement("div");d.className="log-entry";d.textContent="[t+"+Math.round(S.t)+"s] "+msg;b.appendChild(d);while(b.children.length>40)b.removeChild(b.firstChild);b.scrollTop=b.scrollHeight}
function achFactor(s){return s.atM===0?1:(s.atM<=.5?.02:(s.atM<=1?.06:.3))}
function baro(s){return!s.vag&&s.atM===0}
function startTracker(s,label){finishTracker(s);s.tr={label,t:0,pre:{...s.cur},s:0,d:0,m:0,h:0}}
function finishTracker(s){if(!s.tr)return;const t=s.tr;s.rows.push({label:t.label,s:Math.round(t.s),d:Math.round(t.d),m:Math.round(t.m),h:Math.round(t.h)});s.tr=null;renderResults()}
function renderResults(){const w=$("resultsWrap");if(!S.rows.length){w.innerHTML='<p class="empty">No interventions recorded yet.</p>';return}
let h="<table><tr><th>Step</th><th>SBP</th><th>DBP</th><th>MAP</th><th>HR</th></tr>";
S.rows.forEach(r=>{const c=document.createElement("td");c.textContent=r.label;h+="<tr><td>"+c.innerHTML+"</td><td>"+sgn(r.s)+"</td><td>"+sgn(r.d)+"</td><td>"+sgn(r.m)+"</td><td>"+sgn(r.h)+"</td></tr>"});
w.innerHTML=h+"</table>"}
function inject(s,k,m,o){o=o||{};
const add=(type,x)=>s.fx.push(Object.assign({type,m:satm(m),age:0,hold:0},x));
const lv=m<=.5?"low":(m<=1?"standard":"high");
switch(k){
case"adrenaline":case"epi_beta":{add("epi",{rise:4,tau:25});
if(k==="epi_beta")return"Adrenaline 0.1 mcg/kg: beta-2 vasodilation outweighs alpha, DBP and MAP fall, HR rises (beta-1).";
let t="Adrenaline ("+lv+"): BP rises (alpha-1 vasoconstriction, beta-1 inotropy). ";
t+=s.A>.3?"Alpha receptors are blocked: unopposed beta-2 vasodilation, BP falls (adrenaline reversal)."
:s.B>.3?"Beta receptors are blocked: alpha pressor action is unmasked, bigger rise, reflex bradycardia."
:baro(s)?"Baroreflex vagal slowing opposes the direct beta-1 tachycardia, so HR changes little or falls."
:"No vagal brake (atropine or vagotomy): unopposed beta-1 tachycardia.";
if(m<=.5&&s.A<.3&&s.B<.3)t+=" Diastolic may dip (beta-2 vasodilation).";return t}
case"norepi":add("ne",{rise:4,tau:25});
return s.A>.3?"Noradrenaline: alpha receptors blocked, almost no pressor response (no beta-2 effect to reverse it).":"Noradrenaline: strong alpha-1 vasoconstriction plus beta-1, big rise in SBP/DBP/MAP; baroreflex bradycardia lowers HR.";
case"iso":add("iso",{rise:3,tau:20});
return s.B>.3?"Isoprenaline: beta receptors blocked by propranolol, response abolished.":"Isoprenaline: beta-1 tachycardia, beta-2 vasodilation, DBP and MAP fall, pulse pressure widens.";
case"acetylcholine":{const nic=s.atM>0?(o.vh?1.6:m>=2?1:m>=1?.3:.05):0;add("ach",{rise:1,tau:7,nic});
if(s.atM>0)return"ACh ("+lv+"): muscarinic receptors blocked, depressor response abolished."+(nic>=1?" Nicotinic action on ganglia and adrenal medulla is unmasked: pressor response.":"");
return"ACh ("+lv+"): brief hypotension (endothelial NO vasodilation) and bradycardia."+(s.vag?" Vagotomy does not block this because ACh acts directly on the receptors.":"")}
case"histamine":add("h1",{rise:2,tau:10});add("h2",{rise:6,tau:40});
return s.H1>.3?"Histamine: H1 blocked, only the delayed H2 effect remains: slow, mild hypotension with tachycardia.":"Histamine: quick H1 vasodilation (sharp fall in BP) then slower H2 vasodilation and tachycardia.";
case"ephedrine":{const m1=satm(m),m2=m1*s.S;s.S*=.6;s.fx.push({type:"eph",m:m2,age:0,hold:0,rise:5,tau:30});
return s.A>.3?"Ephedrine: released noradrenaline cannot act on blocked alpha receptors, pressor response abolished.":"Ephedrine ("+lv+"): indirect (releases NE) pressor response; store depletion makes repeated doses weaker (tachyphylaxis, response now "+Math.round(m2/m1*100)+"% of first)."}
case"phentolamine":s.A=Math.max(s.A,blk(m));
return"Phentolamine ("+lv+"): alpha-1/alpha-2 blockade. Vasodilation lowers MAP, reflex tachycardia (plus more NE release via alpha-2 block) raises HR.";
case"propranolol":s.B=Math.max(s.B,blk(m));
return"Propranolol ("+lv+"): beta-1/beta-2 blockade. HR falls, contractility falls, isoprenaline now ineffective.";
case"atropine":s.atM=Math.max(s.atM,m);s.atH=Math.max(s.atH,m<=.5?25:(m<=1?40:50));
return"Atropine ("+lv+"): muscarinic blockade. Vagal tone removed, HR rises and stays up; ACh and baroreflex slowing are now ineffective.";
case"mepyramine":s.H1=.9;return"Mepyramine: H1 receptors blocked (little effect on baseline BP).";
case"cimetidine":s.H2=.9;return"Cimetidine: H2 receptors blocked (little effect on baseline BP).";
case"occlusion":add("occl",{rise:3,hold:15,tau:6});
return"Bilateral carotid occlusion: carotid sinus pressure falls, baroreceptor firing falls, sympathetic outflow rises and vagal tone falls: MAP and HR rise until release.";
case"vagC":add("vagC",{rise:1,hold:10,tau:2});return"Central vagus stimulation: afferent input causes a mild reflex fall in BP and HR.";
case"vagP":add("vagP",{rise:1,hold:10,tau:3});
return s.atM>0?"Peripheral vagus stimulation: muscarinic receptors blocked, no response.":"Peripheral vagus stimulation: efferent ACh release slows the heart (M2): bradycardia and fall in BP.";
case"vagotomy":if(s.vag)return"Both vagi are already cut.";s.vag=true;return"Both vagi cut: neural vagal tone lost, HR rises. Receptors are intact, so ACh still works."}
return""}
function env(e){if(e.age<e.rise)return e.age/e.rise;if(e.age<e.rise+e.hold)return 1;return Math.exp(-(e.age-e.rise-e.hold)/e.tau)}
function step(s,dt){
s.t+=dt;s.fx.forEach(e=>e.age+=dt);s.fx=s.fx.filter(e=>e.age<e.rise+e.hold+e.tau*5);
while(s.q.length&&s.t>=s.q[0].at){const j=s.q.shift();startTracker(s,j.label);s.marks.push({at:s.t,l:shortLbl(j.label)});logMessage(inject(s,j.k,j.m,j.o))}
s.S+=(1-s.S)*(1-Math.exp(-dt/300));
const rk=1-Math.exp(-dt/6);s.Af+=(s.A-s.Af)*rk;s.Bf+=(s.B-s.Bf)*rk;
const al=1-s.Af,be=1-s.Bf;
let dSys=0,dDia=0,dHR=0,rSys=0,rDia=0;
for(const e of s.fx){const a=env(e),m=e.m;let ds=0,dd=0,dh=0,reflex=true;
switch(e.type){
case"epi":{const bb=Math.min(1,m/.05),f1=Math.max(m,.5*bb)*be;ds=30*m*al+20*f1;dd=40*m*al-25*bb*be;dh=40*f1;break}
case"ne":ds=(35*al+10*be)*m;dd=40*al*m;dh=30*be*m;break;
case"iso":ds=5*m*be;dd=-30*m*be;dh=60*m*be;break;
case"eph":ds=(25*al+10*be)*m;dd=(25*al-4*be)*m;dh=25*be*m;break;
case"h1":{const h=1-s.H1;ds=-35*m*h;dd=-30*m*h;break}
case"h2":{const h=1-s.H2;ds=-15*m*h;dd=-15*m*h;dh=20*m*h;break}
case"ach":{const f=achFactor(s);ds=-55*m*f+30*e.nic;dd=-40*m*f+25*e.nic;dh=-55*m*f+15*e.nic;break}
case"occl":ds=35;dd=25;dh=s.vag?10:20;reflex=false;break;
case"vagC":{const v=s.vag?0:1;ds=-10*v;dd=-8*v;dh=-10*v;reflex=false;break}
case"vagP":{const f=achFactor(s);ds=-35*f;dd=-25*f;dh=-45*f;reflex=false;break}}
dSys
