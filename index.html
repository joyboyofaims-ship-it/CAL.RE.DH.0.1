<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pharmacology CAL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6e4f">
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#0f172a;--muted:#5b6b82;--line:#d9dfeb;--accent:#0b6e4f;--on-ac:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#141b2e;--text:#e8ecf5;--muted:#94a3b8;--line:#26304a;--accent:#34d399;--on-ac:#0b1020}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
main{max-width:500px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px;color:var(--accent)}
p.sub{margin:0 0 20px;color:var(--muted);font-size:.9rem}
nav{display:flex;flex-direction:column;gap:12px}
nav a{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;box-shadow:0 1px 0 var(--line);transition:transform .12s}
nav a .ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.75rem;background:color-mix(in srgb,var(--accent) 14%,var(--card))}
nav a .tx{flex:1;min-width:0}
nav a small{display:block;margin-top:2px;font-weight:400;color:var(--muted);font-size:.82rem}
nav a .go{flex:none;color:var(--muted);font-size:1.3rem}
nav a:active{background:var(--accent);color:var(--on-ac);transform:scale(.98)}
nav a:active small,nav a:active .go{color:var(--on-ac)}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--accent) 35%,var(--bg)),var(--bg) 70%);text-align:center;transition:opacity .35s}
#splash.hide{opacity:0;pointer-events:none}
#splash .brand{font-weight:800;color:var(--accent);letter-spacing:.04em}
#splash .big{font-size:5.5rem;line-height:1;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.2))}
#splash .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px 18px;box-shadow:0 10px 30px rgba(0,0,0,.12);animation:pop .4s ease}
#splash .tag{display:inline-block;margin-bottom:10px;padding:3px 12px;border-radius:99px;background:var(--accent);color:var(--on-ac);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
#splash h2{margin:0 0 8px;font-size:1.3rem;line-height:1.25}
#splash p{margin:0;color:var(--muted);font-size:1rem;line-height:1.5}
#splash .bar{margin-top:16px;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
#splash .bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;animation:drain 3.5s linear forwards}
#splash .row{display:flex;gap:10px}
#splash button{font:inherit;font-weight:700;padding:11px 18px;border-radius:99px;border:1px solid var(--accent);cursor:pointer}
#splash .nx{background:var(--accent);color:var(--on-ac)}
#splash .sk{background:transparent;color:var(--accent)}
@keyframes bob{50%{transform:translateY(-10px) rotate(-5deg)}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes drain{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){#splash .big,#splash .card{animation:none}}
</style></head><body>
<div id="splash" role="status" aria-live="polite">
<div class="brand">💊 Pharmacology CAL</div>
<div class="big" id="emo" aria-hidden="true"></div>
<div class="card">
<span class="tag">🤯 Did you know?</span>
<h2 id="ft"></h2>
<p id="fb"></p>
<div class="bar"><i id="bar"></i></div>
</div>
<div class="row"><button class="nx" id="nx" type="button">Another fact 🎲</button><button class="sk" id="sk" type="button">Skip ➜</button></div>
</div>
<main>
<h1>💊 Pharmacology CAL</h1>
<p class="sub">Pick a simulator 👇</p>
<nav aria-label="Simulators">
<a href="dog.html"><span class="ic" aria-hidden="true">🐕</span><span class="tx">Dog CV<small>Anesthetized dog blood pressure and heart rate (Ex. 9)</small></span><span class="go" aria-hidden="true">›</span></a>
<a href="rabbit.html"><span class="ic" aria-hidden="true">🐰</span><span class="tx">Rabbit eye<small>Pupil, light and corneal reflex, IOP</small></span><span class="go" aria-hidden="true">›</span></a>
<a href="frogheart.html"><span class="ic" aria-hidden="true">🫀</span><span class="tx">Frog heart<small>Heart tracing with drugs</small></span><span class="go" aria-hidden="true">›</span></a>
<a href="frog_oesophagus_CAL.html"><span class="ic" aria-hidden="true">🐸</span><span class="tx">Frog oesophagus<small>Ciliary movement</small></span><span class="go" aria-hidden="true">›</span></a>
<a href="histamine-bioassay.html"><span class="ic" aria-hidden="true">🧪</span><span class="tx">Histamine bioassay<small>Guinea pig ileum</small></span><span class="go" aria-hidden="true">›</span></a>
</nav>
</main>
<script>
(function(){
var F=[
["💊","A single aspirin “lasts” a week","Platelets can’t make new enzyme, so one dose blocks them until they’re replaced, about 7 to 10 days."],
["💥","Dynamite and a heart medicine are the same molecule","Nitroglycerin goes under the tongue for angina. Alfred Nobel was once prescribed it himself."],
["🐍","A snake bite led to a BP tablet","Captopril was designed from the venom of the Brazilian pit viper, which crashes its prey’s blood pressure."],
["💉","The deadliest known toxin sits in beauty clinics","Botulinum toxin blocks acetylcholine release. In tiny doses it smooths wrinkles."],
["💙","Viagra was meant for angina","Sildenafil failed as a heart drug, but the trial volunteers noticed a different effect."],
["💇","A hair-growth lotion started as a BP pill","Minoxidil lowered blood pressure and also made hair grow, so the idea was turned around."],
["🍊","Your breakfast grapefruit can change your tablet’s strength","It blocks the gut enzyme CYP3A4, so some drugs reach much higher levels."],
["👁️","Atropine is named after the Fate who cuts your life thread","Belladonna means “beautiful lady”, because women dilated their pupils with it to look attractive."],
["🧡","Rifampicin turns tears orange","It can also stain soft contact lenses for good."],
["🐡","Pufferfish and your dentist use the same trick","Tetrodotoxin and lignocaine both block sodium channels. One numbs a tooth and the other can kill you."],
["🏹","Curare paralyses but keeps you awake","It’s an arrow poison, which is why muscle relaxants are only given with anaesthesia."],
["🐶","Heparin is named after the liver","Hepar is Greek for liver, and it was first found in dog liver."],
["😴","Morphine is named after Morpheus","Morpheus was the Greek god of dreams."],
["🎻","Some musicians take a BP pill for stage fright","Propranolol stops the shaking hands and racing heart, though this is off-label."],
["🥱","Ephedrine is a drug that gets tired","Repeat the dose and the effect shrinks, because it uses up the noradrenaline stores it releases. Try it in the dog simulator."],
["🔄","Adrenaline can make blood pressure fall","Give an alpha blocker first and the same dose drops BP instead of raising it (Dale’s reversal). Reproduce it in the dog simulator."],
["🌸","Foxglove is a pretty flower and the source of digoxin","The dose that helps the heart and the dose that harms it are very close."],
["🤧","One chemical, two jobs","Histamine runs your nose through H1 receptors and drives stomach acid through H2. That’s why cimetidine works for ulcers."]
];
var $=function(i){return document.getElementById(i)},sp=$("splash"),last=-1,timer,ms=3500;
function show(t){
  ms=t||3500;clearTimeout(timer);
  var i;do{i=Math.floor(Math.random()*F.length)}while(i===last);last=i;
  $("emo").textContent=F[i][0];$("ft").textContent=F[i][1];$("fb").textContent=F[i][2];
  var b=$("bar");b.style.animation="none";void b.offsetWidth;b.style.animation="drain "+ms+"ms linear forwards";
  var c=sp.querySelector(".card");c.style.animation="none";void c.offsetWidth;c.style.animation="";
  sp.classList.remove("hide");timer=setTimeout(hide,ms);
}
function hide(){clearTimeout(timer);sp.classList.add("hide")}
show();
$("nx").addEventListener("click",function(){show(6000)});
$("sk").addEventListener("click",hide);
document.querySelectorAll("nav a").forEach(function(a){
  a.addEventListener("click",function(){show(8000)});
});
window.addEventListener("pageshow",function(e){if(e.persisted)hide()});
})();
</script>
</body></html>
